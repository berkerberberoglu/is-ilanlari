<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Berker — İş İlanları Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3349;
    --accent: #4f8ef7;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --purple: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --tag-bg: #1e2235;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
  .update-time { font-size: 12px; color: var(--muted); }
  .stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .stat-item strong { color: var(--text); }

  /* TABS */
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin: 14px 0 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: none; transition: all .2s; background: transparent; color: var(--muted); }
  .tab.active { background: var(--accent); color: #fff; }
  .tab:hover:not(.active) { background: var(--surface2); color: var(--text); }
  .tab-count { display: inline-block; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 1px 6px; font-size: 11px; margin-left: 4px; }

  /* FILTERS */
  .filters { padding: 12px 20px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; background: var(--bg); }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); white-space: nowrap; transition: all .2s; }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.1); }
  .search-bar { flex: 1; min-width: 150px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; outline: none; }
  .search-bar:focus { border-color: var(--accent); }

  /* GRID — tek kolon, telefon ve masaüstünde aynı */
  .grid { padding: 12px 16px; display: grid; grid-template-columns: 1fr; gap: 10px; max-width: 700px; margin: 0 auto; }
  @media (max-width: 600px) { .grid { padding: 10px 12px; gap: 8px; } }

  /* CARD */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; transition: all .2s; position: relative; overflow: hidden; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.status-fav { border-left: 3px solid var(--yellow); }
  .card.status-applied { border-left: 3px solid var(--green); opacity: .75; }
  .card.status-skip { border-left: 3px solid var(--red); opacity: .45; }
  .card.hidden { display: none; }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .company { font-size: 12px; color: var(--muted); font-weight: 500; }
  .sector-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--tag-bg); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }

  .position { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.3; }

  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .meta-item { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .badge-green { background: rgba(52,211,153,.15); color: var(--green); }
  .badge-yellow { background: rgba(251,191,36,.15); color: var(--yellow); }
  .badge-red { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-blue { background: rgba(79,142,247,.15); color: var(--accent); }
  .badge-purple { background: rgba(167,139,250,.15); color: var(--purple); }

  /* ACTIONS */
  .card-actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn-link { flex: 1; padding: 9px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; text-align: center; display: block; transition: opacity .2s; }
  .btn-link:hover { opacity: .85; }
  .btn-icon { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 14px; transition: all .2s; color: var(--text); }
  .btn-icon:hover { background: var(--surface2); }
  .btn-icon.active-fav { background: rgba(251,191,36,.15); border-color: var(--yellow); }
  .btn-icon.active-applied { background: rgba(52,211,153,.15); border-color: var(--green); }
  .btn-icon.active-skip { background: rgba(248,113,113,.15); border-color: var(--red); }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* SECTION HEADER */
  .section-header { padding: 8px 20px 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }

  /* TEAM MANAGEMENT WARNING */
  .warning-banner { margin: 4px 0 0; padding: 6px 10px; background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.2); border-radius: 8px; font-size: 11px; color: var(--yellow); }
  .script-banner { margin: 4px 0 0; padding: 6px 10px; background: rgba(167,139,250,.08); border: 1px solid rgba(167,139,250,.25); border-radius: 8px; font-size: 11px; color: var(--purple); }

  /* SIRALAMA BUTONU */
  .sort-btn { font-weight: 700; border-color: var(--accent) !important; color: var(--accent) !important; }
  .sort-btn.sorted { background: rgba(79,142,247,0.15) !important; }

  /* ANALİST SEKMESİ */
  .tab-analyst.active { background: #0ea5e9 !important; color: #fff !important; }
  .badge-analyst { background: rgba(14,165,233,.15); color: #0ea5e9; }

  /* İŞARETLİ SEKME STİLLERİ */
  .tab-fav-tab.active { background: rgba(251,191,36,.85) !important; color: #000 !important; }
  .tab-applied-tab.active { background: rgba(52,211,153,.85) !important; color: #000 !important; }
  .tab-skip-tab.active { background: rgba(248,113,113,.85) !important; color: #000 !important; }
  .completed-badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 600; margin-right: 4px; }
  .badge-applied { background: rgba(52,211,153,.15); color: var(--green); }
  .badge-skip { background: rgba(248,113,113,.15); color: var(--red); }
  .badge-fav { background: rgba(251,191,36,.15); color: var(--yellow); }
  .card.in-action { opacity: 1 !important; }

  /* SCROLLTOP */
  .scroll-top { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; font-size: 18px; display: none; align-items: center; justify-content: center; z-index: 99; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .scroll-top.visible { display: flex; }

  /* LAST UPDATED */
  .footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
</style>
</head>

// ============================================================
// DURUM YÖNETİMİ (localStorage)
// ============================================================
function getStatus(id) { return localStorage.getItem('job_'+id) || 'none'; }
function setStatus(id, status) {
  const cur = getStatus(id);
  if (cur === status) { localStorage.removeItem('job_'+id); renderCards(); }
  else { localStorage.setItem('job_'+id, status); renderCards(); }
  updateStats();
}
function markViewed(id) {
  if (!localStorage.getItem('viewed_'+id)) {
    localStorage.setItem('viewed_'+id, '1');
    updateStats();
  }
}

// ============================================================
// RENDER
// ============================================================
let currentTab = 'all';
let currentSector = 'all';
let sortNewest = false;

function toggleSort(btn) {
  sortNewest = !sortNewest;
  btn.textContent = sortNewest ? '🕐 Son Eklenen ✓' : '🕐 Son Eklenen';
  btn.classList.toggle('sorted', sortNewest);
  renderCards();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderCards();
}

function filterSector(sector, btn) {
  currentSector = sector;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() { renderCards(); }

function renderCards() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';

  let filtered = jobs.filter(j => {
    const status = getStatus(j.id);
    const isActioned = status === 'fav' || status === 'applied' || status === 'skip';

    // Ayrı aksiyon sekmeleri — sadece ilgili statüsü göster
    if (currentTab === 'fav') return status === 'fav';
    if (currentTab === 'applied') return status === 'applied';
    if (currentTab === 'skip') return status === 'skip';

    // Script sekmesi: script alanı olanlar (işaretliler hariç)
    if (currentTab === 'script') return !!j.script && !isActioned;

    // Analist sekmesi: category=analyst olanlar (işaretliler hariç)
    if (currentTab === 'analyst') return j.category === 'analyst' && !isActioned;

    // Ana listeler (tümü, big, mid, startup, remote, warn): işaretlileri gösterme
    if (isActioned) return false;

    if (currentTab !== 'all' && j.category !== currentTab) return false;
    if (currentSector !== 'all' && !j.sector.toLowerCase().includes(currentSector.toLowerCase())) return false;
    if (search && !j.company.toLowerCase().includes(search) && !j.position.toLowerCase().includes(search) && !j.sector.toLowerCase().includes(search)) return false;
    return true;
  });

  // Sıralama: son eklenen üstte (id büyükten küçüğe)
  if (sortNewest) filtered = filtered.slice().sort((a, b) => b.id - a.id);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div>İlan bulunamadı</div></div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';

  const isActionTab = currentTab === 'fav' || currentTab === 'applied' || currentTab === 'skip';

  filtered.forEach(j => {
    const status = getStatus(j.id);
    const card = document.createElement('div');
    card.className = isActionTab ? 'card in-action' : 'card';

    const catBadge = { big:'🏛️ Büyük', mid:'🏢 Orta', startup:'🚀 Startup', remote:'🌍 Remote', warn:'⚠️ Dikkat', analyst:'📊 Analist' };
    const catColor = { big:'badge-blue', mid:'badge-purple', startup:'badge-green', remote:'badge-green', warn:'badge-yellow', analyst:'badge-analyst' };

    // Aksiyon sekmelerinde durum rozeti göster
    const statusLabel = isActionTab
      ? (status === 'applied' ? '<span class="completed-badge badge-applied">✅ Başvuruldu</span>'
        : status === 'fav' ? '<span class="completed-badge badge-fav">⭐ Favori</span>'
        : '<span class="completed-badge badge-skip">❌ Geçildi</span>')
      : '';

    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="company">${statusLabel}${j.company}</div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
          <span class="badge ${catColor[j.category]}">${catBadge[j.category]}</span>
          <span class="sector-tag">${j.sector}</span>
        </div>
      </div>
      <div class="position">${j.position}</div>
      <div class="meta">
        <span class="meta-item">📍 ${j.location}</span>
        <span class="meta-item">✨ ${j.fit}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.4;">${j.note}</div>
      ${j.category==='warn' ? '<div class="warning-banner">⚠️ Ekip yönetimi / fazla deneyim gerektirebilir</div>' : ''}
      ${j.script ? `<div class="script-banner">💡 ${j.script}</div>` : ''}
      <div class="card-actions">
        <a href="${j.url}" target="_blank" class="btn-link" onclick="markViewed(${j.id})">Görüntüle →</a>
        <button class="btn-icon ${status==='fav'?'active-fav':''}" onclick="setStatus(${j.id},'fav')" title="Favorile">⭐</button>
        <button class="btn-icon ${status==='applied'?'active-applied':''}" onclick="setStatus(${j.id},'applied')" title="Başvurdum">✅</button>
        <button class="btn-icon ${status==='skip'?'active-skip':''}" onclick="setStatus(${j.id},'skip')" title="Geç">❌</button>
      </div>
    `;
    grid.appendChild(card);
  });

  container.appendChild(grid);
}

function updateStats() {
  const isActioned = j => { const s = getStatus(j.id); return s === 'fav' || s === 'applied' || s === 'skip'; };
  const active = jobs.filter(j => !isActioned(j));

  const favs    = jobs.filter(j => getStatus(j.id)==='fav').length;
  const applied = jobs.filter(j => getStatus(j.id)==='applied').length;
  const skipped = jobs.filter(j => getStatus(j.id)==='skip').length;
  const viewed  = jobs.filter(j => localStorage.getItem('viewed_'+j.id)).length;

  document.getElementById('totalCount').textContent = active.length;
  document.getElementById('favCount').textContent = favs;
  document.getElementById('appliedCount').textContent = applied;
  document.getElementById('viewedCount').textContent = viewed;

  // Ana sekme sayaçları — sadece işaretlenmemiş aktif ilanlar
  document.getElementById('count-all').textContent     = active.length;
  document.getElementById('count-big').textContent     = active.filter(j=>j.category==='big').length;
  document.getElementById('count-mid').textContent     = active.filter(j=>j.category==='mid').length;
  document.getElementById('count-startup').textContent = active.filter(j=>j.category==='startup').length;
  document.getElementById('count-remote').textContent  = active.filter(j=>j.category==='remote').length;
  document.getElementById('count-warn').textContent    = active.filter(j=>j.category==='warn').length;
  document.getElementById('count-script').textContent   = active.filter(j=>j.script).length;
  document.getElementById('count-analyst').textContent  = jobs.filter(j=>j.category==='analyst' && !isActioned(j)).length;

  // Aksiyon sekme sayaçları
  document.getElementById('count-fav').textContent     = favs;
  document.getElementById('count-applied').textContent = applied;
  document.getElementById('count-skip').textContent    = skipped;
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('updateTime').textContent = 'Güncellendi: ' + LAST_UPDATED;
  document.getElementById('footerDate').textContent = LAST_UPDATED;
  updateStats();
  renderCards();

  // Scroll to top button
  window.addEventListener('scroll', () => {
    document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 300);
  });
});
</script>
</body>
</html>
