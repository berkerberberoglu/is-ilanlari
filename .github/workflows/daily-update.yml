name: Daily Dashboard Update

on:
  schedule:
    - cron: "3 5 * * *"   # Her gün 08:03 Türkiye saati (UTC+3)
  workflow_dispatch:        # Manuel tetikleme butonu

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp in dashboard
        run: |
          DATE=$(TZ="Europe/Istanbul" date "+%d %B %Y, %H:%M")
          sed -i "s/const LAST_UPDATED = \"[^\"]*\"/const LAST_UPDATED = \"${DATE} (otomatik)\"/" index.html
          echo "Timestamp guncellendi: $DATE"

      - name: Commit and push
        run: |
          git config user.email "berkerberberoglu@users.noreply.github.com"
          git config user.name "Dashboard Bot"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Dashboard otomatik guncellendi - $(TZ=Europe/Istanbul date +%d.%m.%Y)"
            git push
            echo "GitHub Pages guncellendi"
          fi
